apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "galoy.migration.jobname" . }}
  labels:
    app: {{ template "galoy.migration.jobname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: Helm
spec:
  backoffLimit: 1
  template:
    spec:
      {{ if or .Values.galoy.trigger.backups.gcs.enabled .Values.galoy.trigger.backups.dropbox.enabled }}
      serviceAccountName: {{ template "flash.name" . }}
      initContainers:
      - name: trigger-mongodb-backup
        image: "groundnuty/k8s-wait-for:v1.5.1"
        command:
        - "/bin/sh"
        - "-c"
        - |
          job_name="{{ template "galoy.preMigration.jobname" . }}"
          echo "Executing ${job_name}"
          kubectl delete job "${job_name}" || true
          kubectl create job --from=cronjob/{{ template "galoy.mongoBackupCron.jobname" . }} "${job_name}"
          sleep 1
          wait_for.sh job "${job_name}"
          sleep 1
          status="$(kubectl get job ${job_name} -o jsonpath='{.status.succeeded}')"
          if [[ "${status}" != "1" ]]; then
            echo "Backup failed!"
            exit 1
          else
            echo "Backup succeeded!"
          fi
          kubectl delete job "${job_name}"
      {{ end }}
      containers:
      - name: mongodb-migrate
        image: "{{ .Values.galoy.images.mongodbMigrate.repository }}@{{ .Values.galoy.images.mongodbMigrate.digest }}"
        resources:
          {{ toYaml .Values.galoy.mongoMigrationJob.resources | nindent 10 }}
        env:
{{ include "galoy.mongodb.env" . | indent 8 }}
        - name: NOTIFICATION_TOPICS
          {{/*
            mongoMigrationJob, NOT config: .Values.galoy.config is serialised
            wholesale into the app's custom.yaml by galoy-custom-config-secret.yaml,
            and the app's configSchema sets additionalProperties:false — so
            reading this from there meant the only way to supply the value was
            to crash-loop every app pod at boot. It was therefore never set,
            the notification-topic migrations threw, migrate-mongo aborted the
            whole run, and prod applied no migration for five months (ENG-565).
            This is migration-Job config; the app reads topics off user
            documents, never from custom.yaml.
          */}}
          value: {{ join "," .Values.galoy.mongoMigrationJob.notificationTopics | quote }}
      restartPolicy: Never
